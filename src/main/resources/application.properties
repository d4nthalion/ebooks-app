spring.application.name=ebooks-api
server.port=8081

# Carpeta raiz de la biblioteca (mas adelante, la carpeta compartida del NAS)
ebooks.root-path=D:\\eBooks
ebooks.allowed-extensions=epub,pdf,mobi,azw3
# Minutos entre reescaneos automaticos de la carpeta
ebooks.auto-refresh-minutes=10

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Direccion del NAS para validar login contra sus cuentas (auth.cgi de DSM).
# No pongas aqui tu URL real: sobreescribe este valor con la variable de entorno
# DSM_BASE_URL, o con un application.properties externo junto al jar (ver README).
dsm.base-url=http://CAMBIA-ESTO:5000
dsm.connect-timeout-ms=3000

# Usuarios que no existen en el NAS (JSON simple, sin base de datos)
app.local-users-file=local-users.json
