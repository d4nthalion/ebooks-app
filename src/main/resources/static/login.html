<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar · BiblioLocal</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <script src="theme.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs><linearGradient id="g-brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
    <symbol id="i-brand" viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="8" fill="url(#g-brand)"/><path d="M16 11c-2-1.5-4.5-2-7.5-1.7v11.4c3-.3 5.5.2 7.5 1.7 2-1.5 4.5-2 7.5-1.7V9.3c-3-.3-5.5.2-7.5 1.7Zm0 0v11.4" fill="none" stroke="#032623" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></symbol>
  </svg>

  <button id="themeToggle" class="tool-btn login-theme" type="button"></button>

  <main class="login-page">
    <div class="login-card">
      <h1 class="brand">
        <svg class="brand-mark" aria-hidden="true"><use href="#i-brand"/></svg>
        <span>Biblio<b>Local</b></span>
      </h1>
      <p class="login-lead">Entra con tu cuenta del NAS.</p>

      <div id="errorBox" class="alert" role="alert" hidden>El usuario o la contraseña no son correctos.</div>
      <div id="blockedBox" class="alert" role="alert" hidden>Demasiados intentos fallidos. Vuelve a probar dentro de 15 minutos.</div>
      <div id="noAccessBox" class="alert warn" role="alert" hidden>Tu cuenta del NAS no tiene acceso a BiblioLocal. Pídeselo al administrador.</div>

      <form action="/login" method="post" class="form-grid">
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" class="input" name="username" type="text" autocomplete="username" required autofocus />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" class="input" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-grad btn-lg" type="submit">Entrar</button>
      </form>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("errorBox").hidden = !params.has("error");
    document.getElementById("blockedBox").hidden = !params.has("blocked");
    document.getElementById("noAccessBox").hidden = !params.has("noaccess");
    initThemeToggle(document.getElementById("themeToggle"));
  </script>
</body>
</html>
