<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biblioteca - Iniciar sesion</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 340px;
      box-shadow: var(--shadow);
    }
    .login-box h1 { margin: 0 0 24px; font-size: 1.2rem; text-align: center; }
    .login-box label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    .login-box input {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }
    .login-box button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .login-error {
      background: #f8d7da;
      color: #842029;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h1>📚 Biblioteca</h1>
      <div id="errorBox" class="login-error" hidden>Usuario o contrasena incorrectos.</div>
      <form action="/login" method="post">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus />
        <label for="password">Contrasena</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Entrar</button>
      </form>
    </div>
  </div>
  <script>
    if (new URLSearchParams(location.search).has("error")) {
      document.getElementById("errorBox").hidden = false;
    }
  </script>
</body>
</html>
