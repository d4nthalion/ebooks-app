<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biblioteca - Iniciar sesion</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="theme.js"></script>
</head>
<body>
  <div class="login-wrap">
    <button id="themeToggle" class="login-theme-toggle" aria-label="Cambiar tema"></button>
    <div class="login-box">
      <h1>📚 Biblioteca</h1>
      <div id="errorBox" class="login-error" hidden>Usuario o contrasena incorrectos.</div>
      <div id="blockedBox" class="login-error" hidden>Demasiados intentos fallidos. Prueba de nuevo en 15 minutos.</div>
      <form action="/login" method="post">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus />
        <label for="password">Contrasena</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Entrar</button>
      </form>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.has("error")) {
      document.getElementById("errorBox").hidden = false;
    }
    if (params.has("blocked")) {
      document.getElementById("blockedBox").hidden = false;
    }
    initThemeToggle(document.getElementById("themeToggle"));
  </script>
</body>
</html>
