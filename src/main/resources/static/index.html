<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biblioteca</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="theme.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>📚 Biblioteca</h1>
    <input id="search" type="search" placeholder="Buscar por titulo o autor..." />
    <button id="refreshBtn" title="Reescanear la carpeta">⟳ Reescanear</button>
    <button id="settingsBtn" title="Configurar email de Kindle">⚙ Kindle</button>
    <button id="themeToggle" aria-label="Cambiar tema"></button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>Autores</h2>
      <ul id="authorList" class="filter-list"></ul>
      <h2>Sagas</h2>
      <ul id="seriesList" class="filter-list"></ul>
    </aside>

    <main>
      <p id="status" class="status"></p>
      <div id="grid" class="grid"></div>
      <p id="empty" class="empty" hidden>No se encontraron libros.</p>
    </main>
  </div>

  <div id="modalOverlay" class="modal-overlay" hidden>
    <div class="modal">
      <button id="modalClose" class="modal-close">&times;</button>
      <div class="modal-content">
        <img id="modalCover" class="modal-cover" alt="Portada" />
        <div class="modal-info">
          <h2 id="modalTitle"></h2>
          <p id="modalAuthor" class="modal-author"></p>
          <p id="modalSeries" class="modal-series"></p>
          <p id="modalMeta" class="modal-meta"></p>
          <div class="modal-actions">
            <a id="modalDownload" class="download-btn" href="#">⬇ Descargar</a>
            <button id="modalSendKindle" class="kindle-btn">📧 Enviar a Kindle</button>
          </div>
          <p id="modalKindleStatus" class="kindle-status" hidden></p>
        </div>
      </div>
    </div>
  </div>

  <div id="settingsOverlay" class="modal-overlay" hidden>
    <div class="modal settings-modal">
      <button id="settingsClose" class="modal-close">&times;</button>
      <div class="settings-content">
        <h2>Email de Kindle</h2>
        <p class="modal-meta">
          Recuerda anadir el remitente de esta app a tu
          <em>Lista de correo aprobada</em> en la configuracion de Amazon,
          o los envios seran rechazados.
        </p>
        <label for="kindleEmailInput">Tu direccion @kindle.com</label>
        <input id="kindleEmailInput" type="email" placeholder="tunombre@kindle.com" />
        <button id="kindleEmailSave" class="download-btn">Guardar</button>
        <p id="settingsStatus" class="kindle-status" hidden></p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>initThemeToggle(document.getElementById("themeToggle"));</script>
</body>
</html>
